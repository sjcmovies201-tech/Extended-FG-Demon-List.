<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- The top of the page -->
  <header>
    <h1 id="site-title"></h1>
    <p id="site-subtitle"></p>
    <a id="submit-button" class="button" target="_blank" rel="noopener"></a>
  </header>

  <!-- Search box -->
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search levels, creators..." />
  </div>

  <!-- Levels get put in here automatically -->
  <main id="list"></main>

  <!-- Load your levels (levels.js), then the code that draws them -->
  <script src="levels.js"></script>
  <script>
    // Put the site info on the page
    document.title = SITE.title;
    document.getElementById("site-title").textContent = SITE.title;
    document.getElementById("site-subtitle").textContent = SITE.subtitle;
    const btn = document.getElementById("submit-button");
    btn.textContent = SITE.submitText;
    btn.href = SITE.submitLink;

    const list = document.getElementById("list");

    // Draw all the levels
    function draw(filter) {
      list.innerHTML = "";
      LEVELS.forEach(function (level, i) {
        const text = (level.name + " " + level.creator + " " + level.verifier).toLowerCase();
        if (filter && !text.includes(filter.toLowerCase())) return;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          '<div class="rank">#' + (i + 1) + '</div>' +
          '<div class="info">' +
            '<h2></h2>' +
            '<p class="by"></p>' +
          '</div>' +
          '<a class="watch" target="_blank" rel="noopener">Watch</a>';

        // textContent keeps things safe if someone types weird symbols
        card.querySelector("h2").textContent = level.name;
        card.querySelector(".by").textContent =
          "by " + level.creator + " • verified by " + level.verifier;
        card.querySelector(".watch").href =
          "https://www.youtube.com/watch?v=" + level.youtube;

        list.appendChild(card);
      });
    }

    draw("");
    document.getElementById("search").addEventListener("input", function (e) {
      draw(e.target.value);
    });
  </script>
</body>
</html>
