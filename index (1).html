<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demonlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="modes">
    <button data-mode="demonlist" class="active">Demonlist</button>
    <button data-mode="grinds">Grinds</button>
  </div>

  <div id="msg" class="msg" hidden></div>

  <!-- ===== DEMONLIST VIEW ===== -->
  <div id="view-demonlist">
    <header>
      <h1 id="site-name"></h1>
      <p id="site-tagline"></p>
    </header>

    <nav>
      <button data-tab="levels" class="active">Levels</button>
      <button data-tab="players">Players</button>
      <button data-tab="submit">Submit record</button>
      <button data-tab="admin">Admin</button>
    </nav>

    <main>
      <section id="levels"></section>
      <section id="players" hidden></section>
      <section id="submit" hidden></section>
      <section id="admin" hidden></section>
    </main>
  </div>

  <!-- ===== GRINDS VIEW (its own list, its own top bar) ===== -->
  <div id="view-grinds" hidden>
    <header>
      <h1 id="grinds-title"></h1>
      <p id="grinds-tagline"></p>
    </header>

    <div class="tools">
      <input type="search" id="grinds-search" placeholder="Search grinds...">
      <select id="grinds-sort" aria-label="Sort grinds">
        <option value="order">My order</option>
        <option value="best-desc">Best % (high to low)</option>
        <option value="best-asc">Best % (low to high)</option>
        <option value="name">Name (A to Z)</option>
      </select>
    </div>

    <main>
      <section id="grinds"></section>
    </main>
  </div>

  <footer>Edit settings in <code>config.js</code>. Manage levels and records from the Admin tab.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="grinds.js"></script>
  <script src="script.js"></script>
</body>
</html>
